name: Market Analytics CI

on:
  # Feature/fix branches run CI when opened as PRs, not on every branch push.
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

# All jobs are read-only. Grant additional permissions only to future
# publishing/deployment jobs that explicitly require them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify Ruff installation
        working-directory: backend
        run: python -m ruff --version
      - name: Check lint and import ordering
        working-directory: backend
        run: python -m ruff check --output-format=github app tests
      - name: Verify Python syntax
        working-directory: backend
        run: python -m compileall -q app tests

  backend-postgres:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: market_analytics
          POSTGRES_USER: market
          POSTGRES_PASSWORD: ci_market_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      TEST_DATABASE_URL: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      DATABASE_URL_UNPOOLED: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify database drivers
        working-directory: backend
        run: python -c "import asyncpg, psycopg, sqlalchemy; print(f'asyncpg={asyncpg.__version__} psycopg={psycopg.__version__} sqlalchemy={sqlalchemy.__version__}')"
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        run: |
          alembic current
          test "$(alembic current | grep -o '0024_portfolio_benchmarks')" = "0024_portfolio_benchmarks"
      - name: Verify migration downgrade and upgrade
        working-directory: backend
        run: |
          alembic downgrade 0018_point_in_time_contract
          test "$(alembic current | grep -o '0018_point_in_time_contract')" = "0018_point_in_time_contract"
          alembic upgrade head
          test "$(alembic current | grep -o '0024_portfolio_benchmarks')" = "0024_portfolio_benchmarks"
      - name: Run backend and PostgreSQL tests
        working-directory: backend
        run: pytest -q --junitxml=pytest-junit.xml
      - name: Ensure PostgreSQL integration tests were not skipped
        working-directory: backend
        run: |
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('pytest-junit.xml'); bad=[t.attrib.get('name') for t in r.iter('testcase') if ('integration' in t.attrib.get('classname','') or 'postgres' in t.attrib.get('classname','')) and t.find('skipped') is not None]; assert not bad, f'Integration tests skipped: {bad}'"
      - name: API health smoke test
        working-directory: backend
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/market-analytics-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready


  neon-integration-migrations:
    # Manual only: this job targets the dedicated Neon integration branch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DATABASE_URL: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Require the dedicated integration endpoint
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(value)
          expected_host = "ep-noisy-pond-bappn0py.c-8.eu-central-1.aws.neon.tech"
          if parsed.hostname != expected_host:
              raise SystemExit(
                  "Refusing to run: NEON_INTEGRATION_DATABASE_URL must point to "
                  "the dedicated market-analytics-integration direct endpoint."
              )
          if not parsed.scheme.startswith("postgresql"):
              raise SystemExit("Refusing to run: expected a PostgreSQL URL.")
          print("Integration endpoint guard passed; URL value not displayed.")
          PY
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify PostgreSQL drivers
        working-directory: backend
        run: python -c "import asyncpg, psycopg; print(f'asyncpg={asyncpg.__version__} psycopg={psycopg.__version__}')"
      - name: Apply Alembic migrations to integration branch only
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        shell: bash
        run: |
          alembic current
          alembic current | grep -q "0024_portfolio_benchmarks"
      - name: Run PostgreSQL integration suite
        working-directory: backend
        run: pytest -q --junitxml=pytest-neon-integration.xml
      - name: Ensure integration tests were not skipped
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-neon-integration.xml")
          skipped = [
              case.attrib.get("name")
              for case in root.iter("testcase")
              if ("integration" in case.attrib.get("classname", "")
                  or "postgres" in case.attrib.get("classname", ""))
              and case.find("skipped") is not None
          ]
          if skipped:
              raise SystemExit(f"Integration tests were skipped: {skipped}")
          print("All detected PostgreSQL integration tests executed.")
          PY

  frontend-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build


  publish-container-images:
    # Build once after successful integration into develop, then publish immutable SHA tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - backend-quality
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f backend/Dockerfile -t market-analytics-api:ci backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 -t market-analytics-frontend:ci frontend
      - name: Scan API image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: market-analytics-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: market-analytics-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish immutable commit-tagged images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker tag market-analytics-api:ci "$IMAGE_PREFIX/api:$IMAGE_TAG"
          docker tag market-analytics-frontend:ci "$IMAGE_PREFIX/frontend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/frontend:$IMAGE_TAG"

  verify-container-images:
    # Main PRs consume the exact images produced by the successful develop push.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - backend-postgres
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull images built from the exact develop commit
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.event.pull_request.head.sha }}
        run: |
          docker pull "$IMAGE_PREFIX/api:$IMAGE_TAG"
          docker pull "$IMAGE_PREFIX/frontend:$IMAGE_TAG"
      - name: Verify source revision labels
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.event.pull_request.head.sha }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          for image in api frontend; do
            actual=$(docker image inspect "$IMAGE_PREFIX/$image:$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$actual" = "$EXPECTED_REVISION" || {
              echo "Image $image was not built from expected revision $EXPECTED_REVISION"
              exit 1
            }
          done
      - name: Scan API image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/api:sha-${{ github.event.pull_request.head.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/frontend:sha-${{ github.event.pull_request.head.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
