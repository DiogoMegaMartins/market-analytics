name: Market Analytics CI

on:
  # Feature/fix branches run CI when opened as PRs, not on every branch push.
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

# All jobs are read-only. Grant additional permissions only to future
# publishing/deployment jobs that explicitly require them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify Ruff installation
        working-directory: backend
        run: python -m ruff --version
      - name: Check lint and import ordering
        working-directory: backend
        run: python -m ruff check --output-format=github app tests
      - name: Verify Python syntax
        working-directory: backend
        run: python -m compileall -q app tests

  backend-postgres:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: market_analytics
          POSTGRES_USER: market
          POSTGRES_PASSWORD: ci_market_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DATABASE_URL: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      TEST_DATABASE_URL: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      DATABASE_URL_UNPOOLED: postgresql+asyncpg://market:ci_market_password@127.0.0.1:5432/market_analytics
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify database drivers
        working-directory: backend
        run: python -c "import asyncpg, psycopg, sqlalchemy; print(f'asyncpg={asyncpg.__version__} psycopg={psycopg.__version__} sqlalchemy={sqlalchemy.__version__}')"
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        run: |
          alembic current
          test "$(alembic current | grep -o '0024_portfolio_benchmarks')" = "0024_portfolio_benchmarks"
      - name: Verify migration downgrade and upgrade
        working-directory: backend
        run: |
          alembic downgrade 0018_point_in_time_contract
          test "$(alembic current | grep -o '0018_point_in_time_contract')" = "0018_point_in_time_contract"
          alembic upgrade head
          test "$(alembic current | grep -o '0024_portfolio_benchmarks')" = "0024_portfolio_benchmarks"
      - name: Run backend and PostgreSQL tests
        working-directory: backend
        run: pytest -q --junitxml=pytest-junit.xml
      - name: Ensure PostgreSQL integration tests were not skipped
        working-directory: backend
        run: |
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('pytest-junit.xml'); bad=[t.attrib.get('name') for t in r.iter('testcase') if ('integration' in t.attrib.get('classname','') or 'postgres' in t.attrib.get('classname','')) and t.find('skipped') is not None]; assert not bad, f'Integration tests skipped: {bad}'"
      - name: API health smoke test
        working-directory: backend
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/market-analytics-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready


  neon-integration-migrations:
    # Manual only: this job targets the dedicated Neon integration branch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DATABASE_URL: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.NEON_INTEGRATION_DATABASE_URL }}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Require the dedicated integration endpoint
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(value)
          expected_host = "ep-noisy-pond-bappn0py.c-8.eu-central-1.aws.neon.tech"
          if parsed.hostname != expected_host:
              raise SystemExit(
                  "Refusing to run: NEON_INTEGRATION_DATABASE_URL must point to "
                  "the dedicated market-analytics-integration direct endpoint."
              )
          if not parsed.scheme.startswith("postgresql"):
              raise SystemExit("Refusing to run: expected a PostgreSQL URL.")
          print("Integration endpoint guard passed; URL value not displayed.")
          PY
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify PostgreSQL drivers
        working-directory: backend
        run: python -c "import asyncpg, psycopg; print(f'asyncpg={asyncpg.__version__} psycopg={psycopg.__version__}')"
      - name: Apply Alembic migrations to integration branch only
        working-directory: backend
        run: alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        shell: bash
        run: |
          alembic current
          alembic current | grep -q "0024_portfolio_benchmarks"
      - name: Run PostgreSQL integration suite
        working-directory: backend
        run: pytest -q --junitxml=pytest-neon-integration.xml
      - name: Ensure integration tests were not skipped
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-neon-integration.xml")
          skipped = [
              case.attrib.get("name")
              for case in root.iter("testcase")
              if ("integration" in case.attrib.get("classname", "")
                  or "postgres" in case.attrib.get("classname", ""))
              and case.find("skipped") is not None
          ]
          if skipped:
              raise SystemExit(f"Integration tests were skipped: {skipped}")
          print("All detected PostgreSQL integration tests executed.")
          PY

  frontend-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build


  publish-container-images:
    # Build once after successful integration into develop, then publish immutable SHA tags.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - backend-quality
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --pull --no-cache --label org.opencontainers.image.revision=${{ github.sha }} -f backend/Dockerfile -t market-analytics-api:ci backend
      - name: Build frontend image
        run: docker build --pull --no-cache --label org.opencontainers.image.revision=${{ github.sha }} -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 -t market-analytics-frontend:ci frontend
      - name: Scan API image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: image
          image-ref: market-analytics-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-api-results.json
          exit-code: "1"
      - name: Upload detailed API vulnerability report
        if: always() && hashFiles('trivy-api-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-api-image-diagnostic
          path: trivy-api-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: image
          image-ref: market-analytics-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish immutable commit-tagged images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          docker tag market-analytics-api:ci "$IMAGE_PREFIX/api:$IMAGE_TAG"
          docker tag market-analytics-frontend:ci "$IMAGE_PREFIX/frontend:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX/frontend:$IMAGE_TAG"

  verify-container-images:
    # Build and scan the PR's own images; no dependency on a previously published GHCR tag.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - backend-postgres
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build API image from PR source
        run: docker build --pull --no-cache --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }} -f backend/Dockerfile -t market-analytics-api:pr backend
      - name: Build frontend image from PR source
        run: docker build --pull --no-cache --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }} -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 -t market-analytics-frontend:pr frontend
      - name: Verify source revision labels
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          for image in market-analytics-api:pr market-analytics-frontend:pr; do
            actual=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            test "$actual" = "$EXPECTED_REVISION" || {
              echo "Image $image was not built from expected PR revision $EXPECTED_REVISION"
              exit 1
            }
          done
      - name: Diagnose setuptools files in the exact API image
        run: |
          docker image inspect market-analytics-api:pr --format 'Image ID={{.Id}} revision={{index .Config.Labels "org.opencontainers.image.revision"}} layers={{json .RootFS.Layers}}'
          docker run --rm --entrypoint sh market-analytics-api:pr -c '
            echo "=== setuptools metadata files ==="
            find /opt/venv /usr/lib/python3 /usr/share -type f \\( -iname "*setuptools*" -o -name METADATA -o -name PKG-INFO \\) -print 2>/dev/null | head -200
            echo "=== embedded third-party SBOM files ==="
            find /opt/venv /usr/lib/python3 -type f \\( -path "*/sboms/*" -o -iname "*sbom*" -o -iname "*.spdx*" -o -iname "*.cdx.json" \\) -print 2>/dev/null
            echo "=== setuptools components declared by embedded SBOMs ==="
            python - <<'PY'
            import json
            from pathlib import Path

            candidates = [
                Path("/opt/venv/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json"),
                Path("/opt/venv/lib/python3.13/site-packages/pydantic_core-2.50.5.dist-info/sboms/pydantic-core.cyclonedx.json"),
                Path("/opt/venv/lib/python3.13/site-packages/watchfiles-1.3.0.dist-info/sboms/watchfiles_rust_notify.cyclonedx.json"),
            ]
            for path in candidates:
                if not path.is_file():
                    continue
                doc = json.loads(path.read_text())
                components = doc.get("components", [])
                for component in components:
                    if component.get("name", "").lower() == "setuptools":
                        print(json.dumps({
                            "sbom": str(path),
                            "component": component,
                        }, sort_keys=True))
            PY
            echo "=== installed setuptools metadata ==="
            python -m pip show setuptools || true
          '
      - name: Scan API image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: image
          image-ref: market-analytics-api:pr
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-api-pr-results.json
          exit-code: "1"
      - name: Print exact Trivy package location
        if: always() && hashFiles('trivy-api-pr-results.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("trivy-api-pr-results.json").read_text())
          for result in report.get("Results", []):
              for item in result.get("Vulnerabilities") or []:
                  if item.get("VulnerabilityID") == "CVE-2025-47273":
                      print({
                          "target": result.get("Target"),
                          "type": result.get("Type"),
                          "class": result.get("Class"),
                          "package": item.get("PkgName"),
                          "installed_version": item.get("InstalledVersion"),
                          "fixed_version": item.get("FixedVersion"),
                          "pkg_path": item.get("PkgPath"),
                          "layer": item.get("Layer"),
                      })
          PY
      - name: Upload exact API Trivy report
        if: always() && hashFiles('trivy-api-pr-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-api-pr-diagnostic
          path: trivy-api-pr-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: image
          image-ref: market-analytics-frontend:pr
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
