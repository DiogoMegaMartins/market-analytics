name: Market Analytics Security

on:
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and audit tool
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pip-audit
      - name: Export installed dependencies excluding the local application package
        working-directory: backend
        run: |
          python -m pip freeze | grep -vi '^market-analytics-backend==' > /tmp/audit-requirements.txt
      - name: Audit third-party Python dependencies
        run: python -m pip_audit --strict -r /tmp/audit-requirements.txt

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Activate pnpm before configuring dependency cache
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high

  repository-security:
    name: Repository vulnerability, secret and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
