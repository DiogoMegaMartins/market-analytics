services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: market_analytics_test
      POSTGRES_USER: market_test
      POSTGRES_PASSWORD: market_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_test -d market_analytics_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
